mode: paper
order_tag: aiagent
data_feed: iex

symbols: [AAPL, MSFT, NVDA, SPY, TSLA, AMZN, META, GOOGL]
symbols_file: symbols.txt
timeframe: 15Min
lookback_days: 10
cycle_seconds: 300
journal_dir: journals

llm:
  provider: auto
  model:

council:
  consensus_threshold: 0.45

options:
  min_dte: 7
  max_dte: 45
  high_iv_threshold: 0.45

risk:
  max_open_positions: 4
  max_risk_per_trade_pct: 0.01
  daily_loss_cap_pct: 0.03
  max_single_asset_exposure_pct: 0.10
  min_cash_reserve_pct: 0.20

crypto:
  quote_allocation_pct: 0.02
  max_total_exposure_pct: 0.20

exits:
  # Multi-Stage Partial Take-Profit Scaling
  crypto_tp1_gain_pct: 0.03       # +3.0% gain -> Close 50%, move SL to Breakeven
  crypto_tp2_gain_pct: 0.06       # +6.0% gain -> Close 30%, trail SL
  crypto_tp3_gain_pct: 0.10       # +10.0% gain -> Close remaining 20% runner
  crypto_tp1_ratio: 0.50          # 50%
  crypto_tp2_ratio: 0.30          # 30%
  crypto_tp3_ratio: 0.20          # 20%
  
  options_tp1_gain_pct: 0.20      # +20% gain -> Close 50%, move SL to Breakeven
  options_tp2_gain_pct: 0.35      # +35% gain -> Close 30%, trail SL
  options_tp3_gain_pct: 0.60      # +60% gain -> Close remaining 20% runner

  # Dynamic Exits & Trailing Protections
  crypto_trailing_activation_pct: 0.04
  crypto_trailing_pullback_pct: 0.02
  crypto_hard_stop_pct: 0.05
  options_trailing_activation_pct: 0.30
  options_trailing_pullback_pct: 0.15
  options_hard_stop_pct: 0.35
  force_close_dte: 1
  council_reversal_exit: true

discord_webhook: ""
